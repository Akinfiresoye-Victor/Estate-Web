{% load static %}
<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/ico" href="{% static 'estate/images/favicon.ico' %}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Changed — Estate Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'members/css/login.css' %}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card" style="align-items: center; justify-content: center; text-align: center;">

      <div class="login-header">
        <div class="brand-logo" style="background: linear-gradient(135deg, #2a7a4b, #3aa86a);">
          <i class="bi bi-check-lg"></i>
        </div>
        <h1 class="brand-name">Estate Web</h1>
        <h2 class="login-title">Password Changed</h2>
        <p class="login-subtitle">Your password has been updated successfully.</p>
      </div>

      <a href="{% url 'login' %}" class="btn-submit" style="text-decoration: none; margin-top: 1rem;">
        <span>Sign In Now</span>
        <i class="bi bi-arrow-right-circle-fill"></i>
      </a>

    </div>

    <div class="side-panel">
      <div class="side-content">
        <i class="bi bi-patch-check"></i>
        <h3>You're All Set</h3>
        <p>Your account is secure. Sign in with your new password.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
