{% load static %}
<!doctype html>
<html lang="en">
<head>
  <link rel="icon" type="image/ico" href="{% static 'estate/images/favicon.ico' %}">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Confirm Email — Estate Web</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'members/css/login.css' %}">
</head>
<body>

<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card" style="text-align: center; align-items: center; justify-content: center;">

      <div class="login-header">
        <div class="brand-logo">
          <i class="bi bi-patch-check-fill"></i>
        </div>
        <h1 class="brand-name">Estate Web</h1>
        <h2 class="login-title">Confirm Your Email</h2>
        <p class="login-subtitle">
          Click the button below to verify<br>
          <strong style="color: var(--gold);">{{ confirmation.email_address.email }}</strong>
        </p>
      </div>

      <form method="post" style="width: 100%;">
        {% csrf_token %}
        <button type="submit" class="btn-submit">
          <span>Confirm Email Address</span>
          <i class="bi bi-check-circle-fill"></i>
        </button>
      </form>

      <div style="margin-top: 1rem;">
        <a href="{% url 'login' %}" class="form-link">
          <i class="bi bi-arrow-left me-1"></i>Back to Sign In
        </a>
      </div>

    </div>

    <div class="side-panel">
      <div class="side-content">
        <i class="bi bi-shield-check"></i>
        <h3>Almost There</h3>
        <p>One click and your Estate Web account will be fully activated.</p>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
