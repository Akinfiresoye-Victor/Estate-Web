<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limited - Estate Web</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Inter', sans-serif; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #333;
        }
        .container { 
            background: white; 
            border-radius: 20px; 
            padding: 3rem; 
            max-width: 500px; 
            width: 90%; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            text-align: center;
        }
        .icon { 
            width: 80px; 
            height: 80px; 
            background: linear-gradient(135deg, #ff6b6b, #ffa500); 
            border-radius: 50%; 
            margin: 0 auto 2rem; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 2.5rem; 
            color: white; 
            font-weight: 700;
        }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 1rem; color: #1a1a1a; }
        p { font-size: 1.1rem; line-height: 1.6; margin-bottom: 2rem; color: #666; }
        .status { 
            background: #f8f9ff; 
            border: 2px solid #e3e8ff; 
            border-radius: 12px; 
            padding: 1rem 2rem; 
            font-size: 1.3rem; 
            font-weight: 600; 
            color: #4f46e5; 
            margin: 2rem 0;
        }
        .retry { 
            background: linear-gradient(135deg, #4f46e5, #7c3aed); 
            color: white; 
            border: none; 
            padding: 1rem 2.5rem; 
            border-radius: 50px; 
            font-size: 1.1rem; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s ease; 
            text-decoration: none; 
            display: inline-block;
        }
        .retry:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(79,70,229,0.4); }
        .footer { margin-top: 3rem; padding-top: 2rem; border-top: 1px solid #e5e7eb; font-size: 0.9rem; color: #9ca3af; }
        @media (max-width: 480px) { .container { padding: 2rem 1.5rem; } h1 { font-size: 1.6rem; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">⏱️</div>
        <h1>Too Many Requests</h1>
        <p>You're sending requests too quickly. Please wait a moment before trying again.</p>
        <div class="status">HTTP 429</div>
        <a href="/" class="retry">← Back to Home</a>
        <div class="footer">
            This is an automated protection measure. Your request will work normally after the cooldown period.
        </div>
    </div>
</body>
</html>
