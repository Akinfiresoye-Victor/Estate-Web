<!doctype html>
<html lang="en">
{% load static %}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Estate Web{% endblock %}</title>

  <!-- Bootstrap and Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Favicon -->
  <link rel="icon" type="image/ico" href="{% static 'estate/images/favicon.ico' %}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Navbar CSS -->
  <link rel="stylesheet" href="{% static 'company/css/navbar.css' %}">

  <!-- Base Styles -->
  <!-- Base Styles -->
  <style>
    :root {
      --primary-color: #1a3c4e;
      --secondary-color: #c19b76;
      --accent-color: #8b7355;
      --text-dark: #2c3e50;
      --text-light: #6c757d;
      --bg-light: #f8f9fa;
      --success-color: #28a745;
      --danger-color: #dc3545;
      --warning-color: #ffc107;
      --info-color: #17a2b8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      color: var(--text-dark);
      line-height: 1.6;
      min-height: 100vh;
      padding-top: 80px !important;
    }

  </style>

  {% block extra_css %}{% endblock %}
</head>

<body>
  <!-- Navbar (includes logo) -->
  {% include 'estate/navbar.html' %}

  <!-- Messages -->
  {% include 'estate/includes/messages.html' %}

  <!-- Main Content Area -->
  <main class="main-content">
    <div class="container-fluid">
      {% block content %}
      <!-- Child templates content goes here -->
      {% endblock %}
    </div>
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>


  {% block extra_js %}{% endblock %}
</body>
</html>
